[package]
name = "ehviewer-windows11"
version = "0.1.0"
description = "EhViewer for Windows 11 (Tauri)"
authors = ["EhViewer for Windows 11 contributors"]
edition = "2021"

[lib]
name = "ehviewer_windows11_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls", "socks"] }
scraper = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
percent-encoding = "2"
thiserror = "2"
regex = "1"
anyhow = "1"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "macros", "net"] }
once_cell = "1"
log = "0.4"
http = "1"
base64 = "0.22"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
